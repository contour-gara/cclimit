[tools]
cargo-release = "1.1.6"
rust = { version = "1.99.0", components = ["rustfmt", "clippy"] }

[tasks]
test = "cargo test"
lint = "cargo fmt --check && cargo clippy --all-targets -- -D warnings"
live = "cargo test -- --ignored"

[tasks.release]
raw = true
usage = 'arg "[level]" help="cargo release に渡す版上げの段階か版番号" default="patch"'
run = "cargo release ${usage_level?} --execute"
