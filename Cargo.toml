[package]
name = "cclimit"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
jiff = { version = "0.2.38", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }

[dev-dependencies]
assert_cmd = "2.2.2"
httpmock = { version = "0.8.3", default-features = false }
predicates = "3.1.4"
pretty_assertions = "1.4.1"
tempfile = "3.27.0"

[profile.release]
strip = true
